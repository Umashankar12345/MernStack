<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Color Change</title>
        <link rel="stylesheet" href="Boxcolor.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-palette"></i> Box Color Change</h1>
            <p class="subtitle">Click boxes to change colors. Use controls to customize.</p>
        </header>
        
        <div class="boxes-container">
            <div class="box" id="box1" style="background: #3498db;">
                <div class="box-label">Box 1</div>
            </div>
            <div class="box" id="box2" style="background: #2ecc71;">
                <div class="box-label">Box 2</div>
            </div>
            <div class="box" id="box3" style="background: #e74c3c;">
                <div class="box-label">Box 3</div>
            </div>
            <div class="box" id="box4" style="background: #f39c12;">
                <div class="box-label">Box 4</div>
            </div>
            <div class="box" id="box5" style="background: #9b59b6;">
                <div class="box-label">Box 5</div>
            </div>
            <div class="box" id="box6" style="background: #1abc9c;">
                <div class="box-label">Box 6</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <h3><i class="fas fa-magic"></i> Change Mode</h3>
                <div class="buttons-container">
                    <button class="control-btn active" onclick="setMode('random')">
                        <i class="fas fa-random"></i> Random Colors
                    </button>
                    <button class="control-btn" onclick="setMode('gradient')">
                        <i class="fas fa-fill-drip"></i> Gradient Colors
                    </button>
                    <button class="control-btn" onclick="setMode('custom')">
                        <i class="fas fa-edit"></i> Custom Color
                    </button>
                    <button class="control-btn" onclick="setMode('rainbow')">
                        <i class="fas fa-rainbow"></i> Rainbow Cycle
                    </button>
                </div>
            </div>
            
            <div class="control-group" id="customColorGroup" style="display: none;">
                <h3><i class="fas fa-eyedropper"></i> Custom Color</h3>
                <div class="color-inputs">
                    <div class="color-input-group">
                        <label>Primary Color</label>
                        <div class="color-input">
                            <input type="color" id="primaryColor" value="#3498db">
                            <input type="text" id="primaryColorText" value="#3498db" placeholder="#000000">
                        </div>
                    </div>
                    <div class="color-input-group">
                        <label>Secondary Color</label>
                        <div class="color-input">
                            <input type="color" id="secondaryColor" value="#2ecc71">
                            <input type="text" id="secondaryColorText" value="#2ecc71" placeholder="#000000">
                        </div>
                    </div>
                </div>
                <button class="control-btn" onclick="applyCustomColor()" style="margin-top: 15px;">
                    <i class="fas fa-check"></i> Apply to All Boxes
                </button>
            </div>
            
            <div class="control-group">
                <h3><i class="fas fa-sliders-h"></i> Actions</h3>
                <div class="buttons-container">
                    <button class="control-btn" onclick="changeAllRandom()">
                        <i class="fas fa-sync"></i> Change All Random
                    </button>
                    <button class="control-btn" onclick="resetColors()">
                        <i class="fas fa-undo"></i> Reset to Default
                    </button>
                    <button class="control-btn" onclick="copyColors()">
                        <i class="fas fa-copy"></i> Copy Colors
                    </button>
                </div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="clickCount">0</div>
                <div class="stat-label">Total Clicks</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="colorChanges">0</div>
                <div class="stat-label">Color Changes</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="uniqueColors">0</div>
                <div class="stat-label">Unique Colors</div>
            </div>
        </div>
        
        <div class="history">
            <h3><i class="fas fa-history"></i> Color History</h3>
            <div class="history-items" id="colorHistory">
                <!-- Color history will appear here -->
            </div>
        </div>
        
        <footer>
            <p>Click any box to change its color. Use the controls for advanced options.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="Boxcolor.js"></script>
</body>
</html>
