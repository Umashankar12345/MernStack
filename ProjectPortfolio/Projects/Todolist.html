<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
   <link rel="stylesheet" href="Todolist.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-list-check"></i> Todo List</h1>
            <p class="subtitle">Organize your tasks efficiently</p>
        </header>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addBtn">Add</button>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        
        <div class="todo-list" id="todoList">
            <!-- Tasks will be added here -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-clipboard-list"></i>
                <h3>No tasks yet</h3>
                <p>Add your first task above!</p>
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="markAllBtn">Mark All Complete</button>
            <button class="control-btn clear" id="clearCompletedBtn">Clear Completed</button>
        </div>
        
        <footer>
            <p>Tasks are saved in your browser's local storage</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="Todolist.js"></script>
    
</body>
</html>
