<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Box Change - Color Picker</title>
        <link rel="stylesheet" href="ColorBox.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-fill-drip"></i> Color Box Change</h1>
            <p class="subtitle">Real-time color picker with multiple color models</p>
        </header>
        
        <div class="main-content">
            <div class="preview-section">
                <div class="color-box" id="colorBox">
                    <!-- Color box preview -->
                </div>
                
                <div class="color-info">
                    <h3><i class="fas fa-info-circle"></i> Color Information</h3>
                    <div class="color-display">
                        <div class="current-color" id="currentColorDisplay"></div>
                        <div class="color-code" id="colorCode">#667eea</div>
                    </div>
                    
                    <div class="color-value" id="rgbValue">RGB: 102, 126, 234</div>
                    <div class="color-value" id="hslValue">HSL: 230°, 78%, 66%</div>
                    <div class="color-value" id="hexValue">HEX: #667eea</div>
                </div>
            </div>
            
            <div class="controls-section">
                <div class="control-group">
                    <h3><i class="fas fa-eyedropper"></i> Color Picker</h3>
                    <div class="color-picker-container">
                        <input type="color" id="colorPicker" class="color-picker" value="#667eea">
                        <div class="slider-container">
                            <div class="slider-group">
                                <label>
                                    <span>Hue: <span class="slider-value" id="hueValue">230</span></span>
                                </label>
                                <input type="range" id="hueSlider" min="0" max="360" value="230">
                            </div>
                            <div class="slider-group">
                                <label>
                                    <span>Saturation: <span class="slider-value" id="saturationValue">78%</span></span>
                                </label>
                                <input type="range" id="saturationSlider" min="0" max="100" value="78">
                            </div>
                            <div class="slider-group">
                                <label>
                                    <span>Lightness: <span class="slider-value" id="lightnessValue">66%</span></span>
                                </label>
                                <input type="range" id="lightnessSlider" min="0" max="100" value="66">
                            </div>
                        </div>
                    </div>
                    
                    <div class="color-inputs">
                        <div class="color-input-group">
                            <label>HEX</label>
                            <input type="text" id="hexInput" value="#667eea" placeholder="#000000">
                        </div>
                        <div class="color-input-group">
                            <label>RGB</label>
                            <input type="text" id="rgbInput" value="102, 126, 234" placeholder="0, 0, 0">
                        </div>
                        <div class="color-input-group">
                            <label>HSL</label>
                            <input type="text" id="hslInput" value="230, 78%, 66%" placeholder="0, 0%, 0%">
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-palette"></i> Preset Colors</h3>
                    <div class="preset-colors">
                        <div class="preset-color" style="background: #667eea;" onclick="setPresetColor('#667eea')"></div>
                        <div class="preset-color" style="background: #2ecc71;" onclick="setPresetColor('#2ecc71')"></div>
                        <div class="preset-color" style="background: #e74c3c;" onclick="setPresetColor('#e74c3c')"></div>
                        <div class="preset-color" style="background: #f39c12;" onclick="setPresetColor('#f39c12')"></div>
                        <div class="preset-color" style="background: #9b59b6;" onclick="setPresetColor('#9b59b6')"></div>
                        <div class="preset-color" style="background: #1abc9c;" onclick="setPresetColor('#1abc9c')"></div>
                        <div class="preset-color" style="background: #34495e;" onclick="setPresetColor('#34495e')"></div>
                        <div class="preset-color" style="background: #e84393;" onclick="setPresetColor('#e84393')"></div>
                        <div class="preset-color" style="background: #00cec9;" onclick="setPresetColor('#00cec9')"></div>
                        <div class="preset-color" style="background: #fd79a8;" onclick="setPresetColor('#fd79a8')"></div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn" onclick="copyColor()">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                        <button class="action-btn" onclick="randomColor()">
                            <i class="fas fa-random"></i> Random
                        </button>
                        <button class="action-btn primary" onclick="applyColor()">
                            <i class="fas fa-check"></i> Apply
                        </button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-fill"></i> Gradient Mode</h3>
                    <div class="gradient-control">
                        <div class="color-picker-container">
                            <label>Color 1</label>
                            <input type="color" id="gradientColor1" value="#667eea" class="color-picker">
                        </div>
                        <div class="color-picker-container">
                            <label>Color 2</label>
                            <input type="color" id="gradientColor2" value="#764ba2" class="color-picker">
                        </div>
                    </div>
                    
                    <div class="gradient-options">
                        <button class="gradient-btn active" onclick="setGradientType('linear')">Linear</button>
                        <button class="gradient-btn" onclick="setGradientType('radial')">Radial</button>
                        <button class="gradient-btn" onclick="setGradientType('conic')">Conic</button>
                        <button class="gradient-btn" onclick="setGradientAngle(0)">0°</button>
                        <button class="gradient-btn" onclick="setGradientAngle(45)">45°</button>
                        <button class="gradient-btn" onclick="setGradientAngle(90)">90°</button>
                        <button class="gradient-btn" onclick="setGradientAngle(180)">180°</button>
                    </div>
                    
                    <button class="action-btn" onclick="applyGradient()" style="margin-top: 15px; width: 100%;">
                        <i class="fas fa-fill"></i> Apply Gradient
                    </button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Select colors using any method - color picker, sliders, or direct input</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="ColorBox.js"></script>
</body>
</html>
