<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <link rel="stylesheet" href="page1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-th"></i> Sudoku Game</h1>
        </header>
        
        <main>
            <div class="game-container">
                <div class="game-header">
                    <div class="controls">
                        <div class="difficulty-selector">
                            <label for="difficulty">Difficulty:</label>
                            <select id="difficulty">
                                <option value="easy">Easy</option>
                                <option value="medium" selected>Medium</option>
                                <option value="hard">Hard</option>
                                <option value="expert">Expert</option>
                            </select>
                        </div>
                        
                        <div class="timer">
                            <i class="fas fa-clock"></i>
                            <span id="time">00:00</span>
                        </div>
                    </div>
                </div>
                
                <div class="sudoku-grid" id="sudokuGrid">
                    <!-- 9x9 grid will be generated by JavaScript -->
                </div>
                
                <div class="number-selector">
                    <div class="numbers">
                        <button class="num-btn" data-number="1">1</button>
                        <button class="num-btn" data-number="2">2</button>
                        <button class="num-btn" data-number="3">3</button>
                        <button class="num-btn" data-number="4">4</button>
                        <button class="num-btn" data-number="5">5</button>
                        <button class="num-btn" data-number="6">6</button>
                        <button class="num-btn" data-number="7">7</button>
                        <button class="num-btn" data-number="8">8</button>
                        <button class="num-btn" data-number="9">9</button>
                        <button class="num-btn clear" data-number="0">
                            <i class="fas fa-eraser"></i> Clear
                        </button>
                    </div>
                </div>
                
                <div class="game-controls">
                    <button id="newGame" class="btn">
                        <i class="fas fa-plus-circle"></i> New Game
                    </button>
                    <button id="check" class="btn">
                        <i class="fas fa-check-circle"></i> Check Solution
                    </button>
                    <button id="reset" class="btn">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                </div>
                
                <div class="message" id="message"></div>
            </div>
        </main>
        
        <footer>
            <p>Sudoku Game &copy; 2023 | Use number buttons or keyboard (1-9) to play</p>
        </footer>
    </div>

    <script src="page1.js"></script>
</body>
</html>
